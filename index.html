<!DOCTYPE html>
<html lang="zh-Hant-TW">
<!-- 水墨萬年曆 v8：加入城市天氣 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水墨萬年曆</title>
<meta name="description" content="中國水墨留白風格的萬年曆：農曆、國定假日、行事曆、城市天氣、每日學習、八卦占卜">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 背景三層：底圖（已移除竹子與船）、竹子、小船 -->
<div class="scene" aria-hidden="true">
  <div class="art">
    <img class="base" src="images/bg-base.webp" alt="">
    <img class="bamboo" src="images/bg-bamboo.webp" alt="">
    <!-- 船下的水波（放在船的下面一層） -->
    <svg class="ripples" viewBox="0 0 320 70">
      <g fill="none" stroke="#222" stroke-linecap="round">
        <ellipse class="ring r1" cx="150" cy="20" rx="130" ry="9" stroke-width="2"/>
        <ellipse class="ring r2" cx="150" cy="20" rx="130" ry="9" stroke-width="2"/>
        <ellipse class="ring r3" cx="150" cy="20" rx="130" ry="9" stroke-width="2"/>
        <path class="wave w1" d="M20 30 q12 -4 24 0 t24 0 t24 0" stroke-width="1.6"/>
        <path class="wave w2" d="M205 34 q12 -4 24 0 t24 0 t24 0" stroke-width="1.6"/>
        <path class="wave w3" d="M95 48 q12 -3 24 0 t24 0 t24 0" stroke-width="1.4"/>
      </g>
    </svg>
    <img class="reflect" src="images/bg-boat.webp" alt="">
    <img class="boat" src="images/bg-boat.webp" alt="">
  </div>
</div>

<!-- 水墨濾鏡（花朵用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 占卜用：毛筆筆觸、淡墨暈染 -->
    <filter id="brush" color-interpolation-filters="sRGB" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <filter id="dwash" color-interpolation-filters="sRGB" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
    <!-- waterwave：讓倒影像在水中晃動（波紋的密度會慢慢變化） -->
    <filter id="waterwave" color-interpolation-filters="sRGB" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.12" numOctaves="1" seed="3" result="t">
        <animate attributeName="baseFrequency" dur="7s" values="0.01 0.10;0.01 0.16;0.01 0.10" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7"/>
    </filter>
    <filter id="ink" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <!-- wash：抖動更大、再加一點模糊，像淡墨暈染 -->
    <filter id="wash" color-interpolation-filters="sRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
  
  </defs>
</svg>

<main>
  <section class="calendar" aria-label="萬年曆">
    <!-- 花邊（上緣、下緣） -->
    <div class="garland top" id="gTop" aria-hidden="true"></div>
    <div class="garland bottom" id="gBottom" aria-hidden="true"></div>

    <div class="head">
      <h1 id="title"></h1>
      <div class="nav">
        <button id="prevYear">« 上一年</button>
        <button id="prevMonth">‹ 上個月</button>
        <button id="today">今天</button>
        <button id="nextMonth">下個月 ›</button>
        <button id="nextYear">下一年 »</button>
      </div>
    </div>
    <p class="info" id="info"></p>
    <p class="remind" id="remind" hidden></p>

    <table>
      <thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead>
      <tbody id="days"></tbody>
    </table>

    <!-- 當日資訊：點日期後顯示 -->
    <section class="detail" id="detail" aria-label="當日資訊">
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <div class="d-date" id="dDate"></div>
      <div class="d-lunar" id="dLunar"></div>
      <div class="d-fest" id="dFest"></div>

      <div class="d-block">
        <div class="d-title">行程與紀念日 <button class="link" id="addEvent">＋ 新增</button></div>
        <ul class="ev-list" id="evList"></ul>
      </div>

      <div class="d-row">
        <div class="d-block">
          <label class="d-title" for="memo">每日備忘</label>
          <textarea id="memo" rows="2" placeholder="寫下今天想記住的事"></textarea>
        </div>
        <div class="d-block">
          <div class="d-title" id="moodTitle">今日心情</div>
          <div class="moods" id="moods" role="radiogroup" aria-labelledby="moodTitle"></div>
        </div>
      </div>
    </section>
  </section>
</main>



<!-- ===== 八卦占卜 ===== -->
<!-- 右上角入口：小小的淡墨八卦 -->
<button class="launcher" id="launcher" aria-label="打開八卦占卜" aria-controls="drawer" aria-expanded="false">
  <svg viewBox="-190 -190 380 380" aria-hidden="true"><g id="launcherBagua"></g></svg>
  <span class="tip">搖卦</span>
</button>
<div class="scrim" id="scrim"></div>
<!-- 從右側滑出的抽屜（關閉時用 inert 讓鍵盤和螢幕閱讀器跳過） -->
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="八卦占卜" inert>
  <div class="drawer-head">
    <h2>易占</h2><small>三錢搖卦</small>
    <span class="seal" aria-hidden="true">問心</span>
    <button class="close" id="closeDrawer" aria-label="關閉占卜">×</button>
  </div>
  <div class="drawer-body" id="drawerBody">
  <!-- ===== 第一階段：點擊八卦 ===== -->
  <section id="stage1">
    <button id="baguaBtn" aria-label="點擊八卦，開始搖卦">
      <svg viewBox="-190 -190 380 380" aria-hidden="true">
        <!-- 八卦後方的一團淡墨暈染 -->
        <circle r="150" fill="currentColor" fill-opacity=".08" filter="url(#dwash)"/>
        <g id="baguaSpin"></g>
      </svg>
    </button>
    <p class="hint" id="hint">靜心默念所問之事　輕點八卦</p>
  </section>

  <!-- ===== 第二階段：搖卦 ===== -->
  <section id="castArea" aria-live="polite">
    <div id="coinBox">
      <svg viewBox="20 60 320 130" role="img" aria-label="三枚銅錢">
        <ellipse cx="180" cy="150" rx="150" ry="34" fill="currentColor" fill-opacity=".07" filter="url(#dwash)"/>
        <g id="coins"></g>
      </svg>
      <p id="castStatus"></p>
    </div>
    <ol id="yaoList"></ol>
  </section>

  <!-- ===== 第三階段：結果 ===== -->
  <section id="result">
    <svg class="divider" viewBox="0 0 700 18" preserveAspectRatio="none" aria-hidden="true">
      <path d="M10 10 C150 6 300 12 450 8 S640 10 690 9" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#brush)" opacity=".7"/>
    </svg>
    <div class="hexCards" id="hexCards"></div>
    <button class="again" id="againBtn">再占一次</button>
  </section>
  </div>
</aside>


<!-- ===== 每日學習 ===== -->
<!-- 入口：小八卦下面的「學」字 -->
<button class="launcher study" id="studyLauncher" aria-label="打開每日學習" aria-controls="studyDrawer" aria-expanded="false">
  <svg viewBox="-190 -190 380 380" aria-hidden="true"><g>
    <path d="M-10 -160 C90 -164 162 -92 160 4 C158 100 82 162 -4 160 C-100 156 -162 84 -158 -10 C-154 -88 -98 -146 -32 -158"
      fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" filter="url(#brush)"/>
    <text x="0" y="52" text-anchor="middle" fill="currentColor">學</text>
  </g></svg>
  <span class="tip">每日學習</span>
</button>
<div class="scrim" id="studyScrim"></div>
<aside class="drawer" id="studyDrawer" role="dialog" aria-modal="true" aria-label="每日學習" inert>
  <div class="drawer-head">
    <h2>每日一學</h2>
    <button class="close" id="closeStudy" aria-label="關閉每日學習">×</button>
  </div>
  <div class="s-tabs" id="studyTabs" role="tablist">
    <button role="tab" data-tab="en" aria-selected="true">英文</button>
    <button role="tab" data-tab="code" aria-selected="false">程式</button>
  </div>
  <div class="drawer-body" id="studyBody">
    <div class="s-bar"><span id="studyWhen"></span><span id="studyCount"></span></div>
    <div class="s-card" id="studyCard" aria-live="polite"></div>
    <div class="s-nav">
      <button class="link" id="prevCard">‹ 上一則</button>
      <button class="link" id="todayCard" hidden>回到今天</button>
      <span class="spacer"></span>
      <button class="link" id="nextCard">下一則 ›</button>
    </div>
    <p class="s-progress" id="studyProgress"></p>

    <!-- 新增學習卡（平常收起來） -->
    <details class="s-add">
      <summary>新增學習卡</summary>
      <label>種類
        <select id="cType"><option value="en">英文</option><option value="code">程式</option></select>
      </label>
      <label id="lFront">單字<input id="cFront" maxlength="80" autocomplete="off"></label>
      <label id="lPos">詞性（選填）<input id="cPos" maxlength="20" placeholder="名詞" autocomplete="off"></label>
      <label id="lMeaning">中文意思<input id="cMeaning" maxlength="200" autocomplete="off"></label>
      <label id="lExample">例句（選填）<textarea id="cExample" rows="3"></textarea></label>
      <label id="lTrans">例句翻譯（選填）<input id="cTrans" maxlength="200" autocomplete="off"></label>
      <p class="err" id="cErr" aria-live="polite"></p>
      <div class="btnrow"><button id="addCard">新增這張卡</button></div>

      <p class="hint2">一次新增很多張：每行一張，用 <code>|</code> 分隔。<br>
        英文：<code>單字 | 意思 | 例句 | 翻譯</code><br>
        程式：<code>標題 | 說明 | 程式碼</code>（程式碼換行寫成 <code>\n</code>）</p>
      <label>貼上多張（種類依照上面的選擇）<textarea id="bulkText" rows="4" placeholder="harvest | 收穫 | We harvest rice in autumn. | 我們在秋天收割稻米。"></textarea></label>
      <p class="err" id="bulkErr" aria-live="polite"></p>
      <div class="btnrow"><button id="bulkAdd">全部新增</button></div>
    </details>
  </div>
</aside>

<!-- ===== 城市天氣 ===== -->
<!-- 入口：「學」下面的「氣」字 -->
<button class="launcher weather" id="weatherLauncher" aria-label="打開城市天氣" aria-controls="weatherDrawer" aria-expanded="false">
  <svg viewBox="-190 -190 380 380" aria-hidden="true"><g>
    <path d="M6 -160 C100 -158 164 -84 160 10 C156 104 78 164 -10 160 C-104 154 -164 80 -158 -16 C-152 -94 -92 -150 -24 -159"
      fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" filter="url(#brush)"/>
    <text x="0" y="52" text-anchor="middle" fill="currentColor">氣</text>
  </g></svg>
  <span class="tip">城市天氣</span>
</button>
<div class="scrim" id="weatherScrim"></div>
<aside class="drawer" id="weatherDrawer" role="dialog" aria-modal="true" aria-label="城市天氣" inert>
  <div class="drawer-head">
    <h2>城市天氣</h2>
    <button class="close" id="closeWeather" aria-label="關閉城市天氣">×</button>
  </div>
  <div class="s-tabs" id="wTabs" role="tablist">
    <button role="tab" data-view="list" aria-selected="true">城市</button>
    <button role="tab" data-view="compare" aria-selected="false">比較</button>
  </div>
  <div class="drawer-body" id="weatherBody">
    <!-- 加入城市：從清單選，或用英文名稱搜尋 -->
    <div class="w-add">
      <select id="wSelect" aria-label="選擇城市"></select>
      <button class="w-btn" id="wAdd">加入</button>
    </div>
    <div class="w-add">
      <input id="wSearch" placeholder="其他城市：輸入英文，例如 Kyoto" aria-label="用英文名稱搜尋其他城市" autocomplete="off">
      <button class="w-btn" id="wSearchBtn">搜尋</button>
    </div>
    <p class="err" id="wErr" aria-live="polite"></p>
    <ul class="w-results" id="wResults"></ul>

    <div id="wList" aria-live="polite"></div>

    <footer class="w-foot">
      <div><span id="wStatus"></span><button class="link" id="wRefresh">重新整理</button></div>
      <p>天氣資料：Open-Meteo<br><span id="wAlertState"></span></p>
    </footer>
  </div>
</aside>

<!-- 行程視窗：查看詳情、新增、修改、刪除 -->
<dialog id="evDialog" aria-labelledby="dlgTitle">
  <form id="evForm" novalidate>
    <h3 id="dlgTitle">新增行程</h3>
    <div id="evView"></div>
    <div id="evEdit">
      <label>主旨<input id="fTitle" maxlength="60" placeholder="和朋友吃飯" autocomplete="off"></label>
      <p class="err" id="fErr" aria-live="polite"></p>
      <div class="grid2">
        <label>日期<input type="date" id="fDate"></label>
        <label>時間<input type="time" id="fTime"></label>
      </div>
      <div class="grid2">
        <label>分類<select id="fCat"></select></label>
        <label class="check" style="margin-top:28px"><input type="checkbox" id="fImp">重要</label>
      </div>
      <label class="check"><input type="checkbox" id="fYearly">每年重複（生日、紀念日）</label>
      <label class="check"><input type="checkbox" id="fLunar">以農曆日期計算</label>
      <label>詳細內容<textarea id="fNote" rows="3" placeholder="地點、要帶的東西、備註"></textarea></label>
    </div>
    <div class="dlg-actions">
      <button type="button" id="btnDelete" class="danger">刪除</button>
      <span class="spacer"></span>
      <button type="button" id="btnCancel">取消</button>
      <button type="button" id="btnEdit">修改</button>
      <button type="submit" id="btnSave" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 左下角工具列 -->
<div class="tools">
  <button id="redraw" title="讓這個月的花框換一種樣子">改變花框</button>
  <button id="exportBtn" title="把行程、備忘、心情存成一個檔案">匯出備份</button>
  <button id="importBtn" title="從備份檔還原資料">匯入備份</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<!-- 程式：順序很重要，後面的檔案會用到前面檔案的函式 -->
<script src="js/config.js"></script>     <!-- 設定（PHP 位置、氣象署授權碼） -->
<script src="js/flowers.js"></script>    <!-- 水墨花朵與花邊 -->
<script src="js/lunar.js"></script>      <!-- 農曆換算 -->
<script src="js/holidays.js"></script>   <!-- 國定假日與節日 -->
<script src="js/app.js"></script>        <!-- 萬年曆主程式 -->
<script src="js/study.js"></script>      <!-- 每日學習 -->
<script src="js/weather.js"></script>    <!-- 城市天氣 -->
<script src="js/divination.js"></script> <!-- 八卦占卜 -->
</body>
</html>
